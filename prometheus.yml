global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Habit Tracker microservices (OpenTelemetry Prometheus exporter)
  - job_name: 'habit-tracker-services'
    metrics_path: '/metrics'
    static_configs:
      - targets:
          - 'localhost:5101'   # login
          - 'localhost:5102'   # register
          - 'localhost:5103'   # logout
          - 'localhost:5104'   # verify
          - 'localhost:5105'   # daily
          - 'localhost:5106'   # scoring
          - 'localhost:5107'   # currentbook
          - 'localhost:5108'   # archives
          - 'localhost:5109'   # settings
          - 'localhost:5110'   # categories
          - 'localhost:5111'   # avatar
          - 'localhost:5112'   # profile
          - 'localhost:5113'   # analytics
