name: 🚀 Deploy to EC2

on:
  push:
    branches: [main, master]

  # Allow triggering manually from the GitHub Actions tab
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy – Monolith
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # ── 1. Show commit info in the Actions log ──────────────────────────
      - name: 📋 Show commit info
        run: |
          echo "Repository : ${{ github.repository }}"
          echo "Branch     : ${{ github.ref_name }}"
          echo "Commit SHA : ${{ github.sha }}"
          echo "Author     : ${{ github.actor }}"
          echo "Triggered  : ${{ github.event_name }}"

      # ── 2. SSH into EC2 and run the deploy script ───────────────────────
      - name: 🔑 SSH → EC2 deploy
        uses: appleboy/ssh-action@v1.2.0
        with:
          host:     ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key:      ${{ secrets.EC2_SSH_KEY }}
          # Give the deploy script plenty of time (build can take a few mins)
          command_timeout: 12m
          script: |
            set -e
            echo "=== [EC2] Deploy triggered by GitHub Actions ==="
            echo "Commit: ${{ github.sha }}"
            echo "Author: ${{ github.actor }}"

            REPO_DIR=~/habit-tracker

            # ── Clone if the directory doesn't exist yet ──────────────────
            if [ ! -d "$REPO_DIR" ]; then
              echo ">>> Repo not found. Cloning for the first time..."
              git clone https://github.com/RamiMechergui/habit-tracker.git "$REPO_DIR"
            fi

            cd "$REPO_DIR"

            # ── Pull latest code ──────────────────────────────────────────
            git fetch origin main
            git reset --hard origin/main

            # ── Rebuild and restart Docker Compose ────────────────────────
            # '|| true' prevents failure when no containers are running yet (first deploy)
            docker compose down --remove-orphans || true

            docker compose up -d --build

            # ── Verify containers started ─────────────────────────────────
            echo "=== Running containers after deploy ==="
            docker compose ps

            # ── Clean up old images ───────────────────────────────────────
            docker image prune -f

            echo "=== [EC2] Deploy finished successfully ==="
