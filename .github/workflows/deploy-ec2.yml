name: 🚀 Deploy to EC2

on:
  push:
    branches: [main, master]

  # Allow triggering manually from the GitHub Actions tab
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy – Monolith on EC2 (port 80 via Nginx + PM2)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      # ── 1. Show commit info in the Actions log ──────────────────────────
      - name: 📋 Show commit info
        run: |
          echo "Repository : ${{ github.repository }}"
          echo "Branch     : ${{ github.ref_name }}"
          echo "Commit SHA : ${{ github.sha }}"
          echo "Author     : ${{ github.actor }}"
          echo "Triggered  : ${{ github.event_name }}"

      # ── 2. SSH into EC2 and run the deploy script ───────────────────────
      # deploy-ec2.sh:
      #   1. git pull (latest code)
      #   2. npm ci --omit=dev  (backend deps)
      #   3. npm ci + VITE_API_URL="" npm run build  (frontend build)
      #   4. rsync dist/ → /var/www/html  (nginx serves on port 80)
      #   5. nginx -t && nginx reload  (zero-downtime static refresh)
      #   6. pm2 reload habit-tracker-api  (zero-downtime API restart)
      #
      # ⚠ DynamoDB data is NEVER touched — only code + static files change.
      - name: 🔑 SSH → EC2 → run deploy-ec2.sh
        uses: appleboy/ssh-action@v1.2.0
        with:
          host:     ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key:      ${{ secrets.EC2_SSH_KEY }}
          # Give the deploy script plenty of time (npm ci + vite build)
          command_timeout: 18m
          script: |
            set -e
            echo "=== [EC2] Deploy triggered by GitHub Actions ==="
            echo "Commit : ${{ github.sha }}"
            echo "Author : ${{ github.actor }}"

            REPO_DIR="${{ secrets.PROJECT_PATH || '~/habit-tracker' }}"
            # Fall back to default path if secret not set
            REPO_DIR="${REPO_DIR:-$HOME/habit-tracker}"

            # ── Clone repo on first deploy ────────────────────────────────
            if [ ! -d "$REPO_DIR" ]; then
              echo ">>> Repo not found — cloning for the first time..."
              git clone https://github.com/RamiMechergui/habit-tracker.git "$REPO_DIR"
            fi

            cd "$REPO_DIR"

            # ── Make deploy script executable and run it ──────────────────
            chmod +x deploy-ec2.sh
            bash deploy-ec2.sh

            echo "=== [EC2] Deploy finished successfully ==="
            echo "App is live on http://${{ secrets.EC2_HOST }} (port 80)"
