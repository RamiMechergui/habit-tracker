events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    server {
        listen 10000;
        
        # Proxy to local services
        location /api/login { proxy_pass http://localhost:5101; }
        location /api/register { proxy_pass http://localhost:5102; }
        location /api/logout { proxy_pass http://localhost:5103; }
        location /api/verify { proxy_pass http://localhost:5104; }
        location /api/daily { proxy_pass http://localhost:5105; }
        location /api/scoring { proxy_pass http://localhost:5106; }
        location /api/currentbook { proxy_pass http://localhost:5107; }
        location /api/archives { proxy_pass http://localhost:5108; }
        location /api/settings { proxy_pass http://localhost:5109; }
        location /api/categories { proxy_pass http://localhost:5110; }
        location /api/avatar { proxy_pass http://localhost:5111; }
        location /api/profile { proxy_pass http://localhost:5112; }
        location /api/analytics { proxy_pass http://localhost:5113; }
        
        # Serve dummy or redirect for root (Frontend will be separate)
        location / {
            return 200 'API Gateway is running';
            add_header Content-Type text/plain;
        }
    }
}
