events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Optimization for single-container deployment
    sendfile        on;
    keepalive_timeout  65;

    server {
        listen 10000;
        
        root /var/www/html;
        index index.html;

        # Static Frontend Files
        location / {
            try_files $uri $uri/ /index.html;
        }

        # Proxy settings for all local services
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts to handle cold starts of 20+ services
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # Proxy to local API services (using 127.0.0.1 for stability)
        location /api/login { proxy_pass http://127.0.0.1:5101; }
        location /api/register { proxy_pass http://127.0.0.1:5102; }
        location /api/logout { proxy_pass http://127.0.0.1:5103; }
        location /api/verify { proxy_pass http://127.0.0.1:5104; }
        location /api/daily { proxy_pass http://127.0.0.1:5105; }
        location /api/scoring { proxy_pass http://127.0.0.1:5106; }
        location /api/currentbook { proxy_pass http://127.0.0.1:5107; }
        location /api/archives { proxy_pass http://127.0.0.1:5108; }
        location /api/settings { proxy_pass http://127.0.0.1:5109; }
        location /api/categories { proxy_pass http://127.0.0.1:5110; }
        location /api/avatar { proxy_pass http://127.0.0.1:5111; }
        location /api/profile { proxy_pass http://127.0.0.1:5112; }
        location /api/analytics { proxy_pass http://127.0.0.1:5113; }

        # ── Observability Tool Proxies ──────────────────────────────────
        location /admin/grafana/ { try_files /dev/null @tool_offline; }
        location /admin/prometheus/ { try_files /dev/null @tool_offline; }
        location /admin/jaeger/ { try_files /dev/null @tool_offline; }

        location @tool_offline {
            add_header Content-Type text/html;
            return 200 '<!DOCTYPE html><html><head><meta charset="utf-8"><style>*{margin:0;padding:0;box-sizing:border-box}body{background:#080a0e;font-family:-apple-system,BlinkMacSystemFont,"Inter",sans-serif;display:flex;align-items:center;justify-content:center;min-height:100vh}.card{text-align:center;padding:48px 40px;background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.08);border-radius:20px;max-width:460px}.icon{font-size:52px;margin-bottom:24px}.title{color:#f8fafc;font-size:22px;font-weight:800;letter-spacing:-0.5px;margin-bottom:10px}.sub{color:#64748b;font-size:15px;line-height:1.6;margin-bottom:24px}.badge{display:inline-flex;align-items:center;gap:8px;padding:8px 16px;border-radius:999px;background:rgba(245,158,11,0.1);border:1px solid rgba(245,158,11,0.3);color:#f59e0b;font-size:13px;font-weight:600}</style></head><body><div class="card"><div class="icon">⚠️</div><h1 class="title">Service Not Running</h1><p class="sub">This observability service is only available when running the full <strong style="color:#f8fafc">docker-compose</strong> stack locally. It is not deployed in the current production container.</p><div class="badge">💡 Run: docker-compose up</div></div></body></html>';
        }

        # Enable large uploads for avatars
        client_max_body_size 10M;
    }
}
