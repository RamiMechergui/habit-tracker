# EVOLVIO monolith — nginx serves the static frontend and proxies /api
# to the single backend process. Kept in sync with nginx.ec2.conf / start.sh.
events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    client_max_body_size 10M;

    # Designate the upstream monolith (Change to your backend's port if it
    # doesn't run on 5001 in your environment.)
    upstream evolvio_backend {
        server 127.0.0.1:5001;
        keepalive 32;
    }

    server {
        listen 80;

        root /var/www/html;
        index index.html;

        # PWA files — never cached
        location ~* (sw\.js|manifest\.json|registerSW\.js|workbox-.+\.js)$ {
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            add_header Pragma "no-cache";
            add_header Expires "0";
            try_files $uri =404;
        }

        # Hashed static assets — cache forever
        location ~* \.(?:js|css|png|jpg|jpeg|gif|svg|ico|woff|woff2|ttf|eot|webp)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            try_files $uri =404;
        }

        # SPA fallback
        location / {
            try_files $uri $uri/ /index.html;
            add_header Cache-Control "no-cache, no-store, must-revalidate";
        }

        # ── Backend monolith
        location ^~ /api/ {
            proxy_pass http://evolvio_backend;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade           $http_upgrade;
            proxy_set_header Connection        "upgrade";
            proxy_cache_bypass $http_upgrade;

            proxy_connect_timeout 60s;
            proxy_send_timeout    300s;
            proxy_read_timeout    300s;
        }

        # Legacy uploaded files
        location ^~ /uploads/ {
            proxy_pass http://evolvio_backend/uploads/;
        }
    }
}