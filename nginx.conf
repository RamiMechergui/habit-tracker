events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    client_max_body_size 10M;

    # Docker internal DNS resolver
    resolver 127.0.0.11 valid=30s ipv6=off;
    resolver_timeout 5s;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # Define allowed origins for CORS (web dev, Android, iOS Capacitor WebView)
    map $http_origin $allow_origin {
        default "";
        "~^http://localhost(:\d+)?$" "$http_origin";
        "~^https://app\.evolvia\.app$" "$http_origin";
        "~^capacitor://app\.evolvia\.app$" "$http_origin";
        "~^capacitor://localhost$" "$http_origin";
    }

    map $allow_origin $cors_credentials {
        default "";
        "~.+" "true";
    }

    map $allow_origin $cors_headers {
        default "";
        "~.+" "Content-Type, Authorization, X-Requested-With, Accept, Origin";
    }

    map $allow_origin $cors_methods {
        default "";
        "~.+" "GET, POST, PUT, DELETE, OPTIONS, HEAD, PATCH";
    }

    server {
        listen 80;

        # Unified CORS Overrides (hides backend headers, inserts dynamic headers)
        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header Access-Control-Allow-Credentials;
        proxy_hide_header Access-Control-Allow-Headers;
        proxy_hide_header Access-Control-Allow-Methods;

        add_header Access-Control-Allow-Origin $allow_origin always;
        add_header Access-Control-Allow-Credentials $cors_credentials always;
        add_header Access-Control-Allow-Headers $cors_headers always;
        add_header Access-Control-Allow-Methods $cors_methods always;

        if ($request_method = 'OPTIONS') {
            return 204;
        }

        # Use variables for proxy_pass to prevent Nginx from crashing 
        # if the backends aren't ready at startup.
        
        location /api/login {
            set $target login:5101;
            proxy_pass http://$target;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        
        location /api/register {
            set $target register:5102;
            proxy_pass http://$target;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        
        location /api/logout {
