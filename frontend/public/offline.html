<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#080a0e" />
  <title>Evolvio — Offline</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700;900&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #080a0e;
      --bg-card: #0f1115;
      --border: rgba(255,255,255,0.07);
      --text: #f1f5f9;
      --muted: #64748b;
      --accent: #3b82f6;
      --accent-glow: rgba(59, 130, 246, 0.25);
      --emerald: #10b981;
      --rose: #ef4444;
    }

    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
      padding: 2rem;
      overflow: hidden;
    }

    /* Animated background */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse 60% 40% at 20% 20%, rgba(59, 130, 246, 0.08) 0%, transparent 60%),
        radial-gradient(ellipse 50% 30% at 80% 80%, rgba(16, 185, 129, 0.06) 0%, transparent 60%);
      pointer-events: none;
      z-index: 0;
    }

    .container {
      position: relative;
      z-index: 1;
      max-width: 420px;
      width: 100%;
      animation: fadeInUp 0.6s ease both;
    }

    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(24px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* Logo */
    .logo-wrap {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-bottom: 2.5rem;
      opacity: 0.7;
    }
    .logo-wrap img { width: 28px; height: 28px; border-radius: 6px; }
    .logo-wrap span {
      font-family: 'Outfit', system-ui, sans-serif;
      font-weight: 900;
      font-size: 1rem;
      letter-spacing: 0.15em;
      color: var(--text);
    }

    /* Animated wifi-off icon */
    .icon-ring {
      width: 100px;
      height: 100px;
      border-radius: 50%;
      margin: 0 auto 2rem;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(239, 68, 68, 0.08);
      border: 1.5px solid rgba(239, 68, 68, 0.25);
      position: relative;
      animation: pulse 2.5s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.15); }
      50% { box-shadow: 0 0 0 18px rgba(239, 68, 68, 0); }
    }
    .icon-ring svg { stroke: var(--rose); }

    h1 {
      font-family: 'Outfit', system-ui, sans-serif;
      font-size: 2rem;
      font-weight: 900;
      margin-bottom: 0.75rem;
      background: linear-gradient(135deg, #f1f5f9 0%, #94a3b8 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .subtitle {
      color: var(--muted);
      line-height: 1.65;
      font-size: 0.95rem;
      margin-bottom: 2rem;
    }

    /* Status card */
    .status-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 1.25rem 1.5rem;
      margin-bottom: 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }
    .status-row {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 0.875rem;
    }
    .status-dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .dot-ok   { background: var(--emerald); box-shadow: 0 0 8px rgba(16,185,129,0.4); }
    .dot-warn { background: #f59e0b; }
    .dot-bad  { background: var(--rose); box-shadow: 0 0 8px rgba(239,68,68,0.4); }

    /* Retry button */
    .btn-retry {
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 10px;
      padding: 0.8rem 2rem;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-family: 'Inter', sans-serif;
      width: 100%;
      justify-content: center;
    }
    .btn-retry:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px var(--accent-glow);
    }
    .btn-retry:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    /* Spinner */
    .spinner {
      width: 16px; height: 16px;
      border: 2px solid rgba(255,255,255,0.3);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Countdown */
    #countdown {
      font-size: 0.8rem;
      color: var(--muted);
      margin-top: 0.75rem;
      min-height: 1.2em;
    }
  </style>
</head>
<body>
  <div class="container">

    <div class="logo-wrap">
      <img src="/icons/icon-128x128.png" alt="Evolvio" onerror="this.style.display='none'" />
      <span>Evolvio</span>
    </div>

    <div class="icon-ring">
      <svg xmlns="http://www.w3.org/2000/svg" width="36" height="36" viewBox="0 0 24 24"
           fill="none" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
        <line x1="2" y1="2" x2="22" y2="22"/>
        <path d="M8.5 16.5a5 5 0 0 1 7 0"/>
        <path d="M2 8.82a15 15 0 0 1 4.17-2.65"/>
        <path d="M10.66 5c4.01-.36 8.14.9 11.34 3.76"/>
        <path d="M16.85 11.25a10 10 0 0 1 2.22 1.68"/>
        <path d="M5 12.86a10 10 0 0 1 5.17-2.87"/>
        <line x1="12" y1="20" x2="12.01" y2="20"/>
      </svg>
    </div>

    <h1>You're Offline</h1>
    <p class="subtitle">No worries — your data is saved locally.<br />
      Everything will sync when you reconnect.</p>

    <div class="status-card">
      <div class="status-row">
        <div class="status-dot dot-ok"></div>
        <span>Local data is available</span>
      </div>
      <div class="status-row">
        <div class="status-dot dot-bad"></div>
        <span>Internet connection unavailable</span>
      </div>
      <div class="status-row">
        <div class="status-dot dot-warn"></div>
        <span>Sync will resume automatically</span>
      </div>
    </div>

    <button class="btn-retry" id="retryBtn" onclick="retryConnection()">
      <span id="retryIcon">↻</span>
      <span id="retryText">Try Again</span>
    </button>
    <div id="countdown"></div>

  </div>

  <script>
    let retrying = false;
    let countdownTimer = null;
    let autoRetryDelay = 5; // seconds for first auto-retry

    function startAutoRetry() {
      let remaining = autoRetryDelay;
      const cd = document.getElementById('countdown');
      cd.textContent = `Auto-retrying in ${remaining}s…`;
      countdownTimer = setInterval(() => {
        remaining--;
        if (remaining <= 0) {
          clearInterval(countdownTimer);
          cd.textContent = '';
          retryConnection(true);
        } else {
          cd.textContent = `Auto-retrying in ${remaining}s…`;
        }
      }, 1000);
      // Exponential backoff — double delay each time (max 60s)
      autoRetryDelay = Math.min(autoRetryDelay * 2, 60);
    }

    async function retryConnection(auto = false) {
      if (retrying) return;
      retrying = true;
      clearInterval(countdownTimer);
      document.getElementById('countdown').textContent = '';
      const btn = document.getElementById('retryBtn');
      const icon = document.getElementById('retryIcon');
      const text = document.getElementById('retryText');
      btn.disabled = true;
      icon.innerHTML = '<div class="spinner"></div>';
      text.textContent = 'Checking…';

      try {
        const res = await fetch('/', { method: 'HEAD', cache: 'no-store' });
        if (res.ok) {
          text.textContent = 'Connected! Reloading…';
          setTimeout(() => window.location.reload(), 500);
          return;
        }
      } catch (e) { /* offline */ }

      // Still offline
      btn.disabled = false;
      icon.textContent = '↻';
      text.textContent = 'Try Again';
      retrying = false;
      startAutoRetry();
    }

    // Start first auto-retry countdown
    startAutoRetry();

    // Also watch for the browser's online event
    window.addEventListener('online', () => {
      clearInterval(countdownTimer);
      window.location.reload();
    });
  </script>
</body>
</html>
