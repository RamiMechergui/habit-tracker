# nginx.ec2.conf — Nginx config for the Evolvia monolith on EC2
#
# INSTALL:
#   sudo cp ~/habit-tracker/nginx.ec2.conf /etc/nginx/sites-available/evolvia
#   sudo ln -sf /etc/nginx/sites-available/evolvia /etc/nginx/sites-enabled/evolvia
#   sudo rm -f /etc/nginx/sites-enabled/default   # remove the default placeholder
#   sudo nginx -t && sudo systemctl reload nginx
#
# If your EC2 uses /etc/nginx/conf.d/ instead of sites-available (Amazon Linux / CentOS):
#   sudo cp ~/habit-tracker/nginx.ec2.conf /etc/nginx/conf.d/evolvia.conf
#   sudo nginx -t && sudo systemctl reload nginx

server {
    # ── Ports ────────────────────────────────────────────────────────────────
    listen 80;
    listen [::]:80;

    # ── Your domain or public IP ──────────────────────────────────────────────
    # Replace with your EC2 hostname or custom domain.
    # Leave as _ to accept any hostname (useful when using the raw IP).
    server_name _;

    # ── Static frontend (built React app) ────────────────────────────────────
    root /var/www/html;
    index index.html;

    # Serve static assets with aggressive caching
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff|woff2|ttf|eot|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA fallback — all non-asset routes serve index.html so React Router works
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── Backend API proxy ─────────────────────────────────────────────────────
    # All /api/* requests are forwarded to the monolithic Express backend
    location /api/ {
        proxy_pass         http://127.0.0.1:5001;
        proxy_http_version 1.1;

        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # WebSocket / keep-alive support
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_cache_bypass $http_upgrade;

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;

        # Allow large uploads (profile pictures, etc.)
        client_max_body_size 10M;
    }

    # ── Uploaded files (served directly by Nginx, bypassing Node) ────────────
    location /uploads/ {
        alias /home/ubuntu/habit-tracker/backend/uploads/;
        expires 7d;
        add_header Cache-Control "public";
    }

    # ── SSE stream — disable proxy buffering for real-time push ──────────────
    location /api/delivery/stream {
        proxy_pass         http://127.0.0.1:5001/api/delivery/stream;
        proxy_http_version 1.1;

        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Disable buffering so SSE events are pushed instantly
        proxy_set_header   Connection        "";
        proxy_buffering    off;
        proxy_cache        off;
        proxy_read_timeout 3600s;   # 1 hour — keep long-lived connections open

        add_header X-Accel-Buffering no;
        add_header Cache-Control no-cache;
    }

    # ── Security headers ──────────────────────────────────────────────────────
    add_header X-Frame-Options       "SAMEORIGIN"   always;
    add_header X-Content-Type-Options "nosniff"      always;
    add_header Referrer-Policy       "strict-origin" always;

    # ── Gzip compression ──────────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types
        text/plain text/css text/javascript application/javascript
        application/json application/xml image/svg+xml;
}
