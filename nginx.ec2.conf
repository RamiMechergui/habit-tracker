# nginx.ec2.conf — Nginx config for the Evolvia monolith on EC2
#
# INSTALL:
#   sudo cp ~/habit-tracker/nginx.ec2.conf /etc/nginx/sites-available/evolvia
#   sudo ln -sf /etc/nginx/sites-available/evolvia /etc/nginx/sites-enabled/evolvia
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
#
# ─────────────────────────────────────────────────────────────────────────────
# HTTPS setup (REQUIRED for PWA install to work — browsers block on HTTP)
#
# Step 1: Point a domain at your EC2 IP in DNS (A record)
# Step 2: Install Certbot:
#   sudo apt install certbot python3-certbot-nginx -y
# Step 3: Get a free SSL cert:
#   sudo certbot --nginx -d yourdomain.com
# Step 4: Certbot will auto-update this file. Reload nginx:
#   sudo nginx -t && sudo systemctl reload nginx
#
# Without HTTPS: service workers cannot register and the install button
# will NEVER appear — this is a hard browser security requirement.
# ─────────────────────────────────────────────────────────────────────────────

# HTTP → HTTPS redirect (uncomment after adding SSL cert)
# server {
#     listen 80;
#     listen [::]:80;
#     server_name yourdomain.com;
#     return 301 https://$host$request_uri;
# }

server {
    # ── Ports ────────────────────────────────────────────────────────────────
    listen 80;
    listen [::]:80;
    # After SSL: listen 443 ssl; listen [::]:443 ssl;

    server_name _;   # Replace _ with your domain when you have one

    # ── Static frontend (built React app) ────────────────────────────────────
    root /var/www/html;
    index index.html;

    # ── PWA critical files — NO caching (must always be fresh) ───────────────
    # sw.js, manifest.json and registerSW.js must NEVER be cached aggressively.
    # If browsers cache these, users get stuck on old service workers forever.
    location ~* (sw\.js|manifest\.json|registerSW\.js|workbox-.+\.js)$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
        try_files $uri =404;
    }

    # Serve hashed static assets with aggressive caching (safe — filenames change on deploy)
    location ~* \.(?:js|css|png|jpg|jpeg|gif|svg|ico|woff|woff2|ttf|eot|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA fallback — all non-asset routes serve index.html so React Router works
    location / {
        try_files $uri $uri/ /index.html;
        # index.html must never be cached so browser always gets fresh SW registration
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # ── Backend API proxy ─────────────────────────────────────────────────────
    location /api/ {
        proxy_pass         http://127.0.0.1:5001;
        proxy_http_version 1.1;

        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_cache_bypass $http_upgrade;

        proxy_connect_timeout 60s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;

        client_max_body_size 10M;
    }

    # ── Uploaded files ────────────────────────────────────────────────────────
    location /uploads/ {
        proxy_pass http://127.0.0.1:5001/uploads/;
    }

    # ── Security headers ──────────────────────────────────────────────────────
    add_header X-Frame-Options        "SAMEORIGIN"   always;
    add_header X-Content-Type-Options "nosniff"      always;
    add_header Referrer-Policy        "strict-origin" always;

    # ── Gzip compression ──────────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types
        text/plain text/css text/javascript application/javascript
        application/json application/xml image/svg+xml;
}
