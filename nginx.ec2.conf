# nginx.ec2.conf — Nginx config for EVOLVIO on EC2
# Serves HTTPS on evolvio.ink with Let's Encrypt SSL
#
# INSTALL:
#   sudo cp ~/habit-tracker/nginx.ec2.conf /etc/nginx/sites-available/evolvia
#   sudo nginx -t && sudo systemctl reload nginx

# ── HTTP → HTTPS redirect ─────────────────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name evolvio.ink www.evolvio.ink;
    return 301 https://$host$request_uri;
}

# ── HTTPS main server ─────────────────────────────────────────────────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name evolvio.ink www.evolvio.ink;

    # Let's Encrypt SSL certificate (managed by Certbot)
    ssl_certificate     /etc/letsencrypt/live/evolvio.ink/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/evolvio.ink/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # ── Static frontend (built React/Vite app) ────────────────────────────────
    root  /var/www/html;
    index index.html;

    # ── PWA critical files — NO caching ──────────────────────────────────────
    location ~* (sw\.js|manifest\.json|registerSW\.js|workbox-.+\.js)$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
        try_files $uri =404;
    }

    # ── Hashed static assets — aggressive caching ────────────────────────────
    location ~* \.(?:js|css|png|jpg|jpeg|gif|svg|ico|woff|woff2|ttf|eot|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ── SPA fallback ─────────────────────────────────────────────────────────
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # ── Backend API proxy ─────────────────────────────────────────────────────
    location /api/ {
        proxy_pass         http://127.0.0.1:5001;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_cache_bypass $http_upgrade;
        proxy_connect_timeout 60s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
        client_max_body_size 10M;
    }

    # ── Uploaded files ────────────────────────────────────────────────────────
    location ^~ /uploads/ {
        proxy_pass http://127.0.0.1:5001/uploads/;
    }

    # ── Security headers ──────────────────────────────────────────────────────
    add_header X-Frame-Options        "SAMEORIGIN"   always;
    add_header X-Content-Type-Options "nosniff"      always;
    add_header Referrer-Policy        "strict-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # ── Gzip compression ──────────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types
        text/plain text/css text/javascript application/javascript
        application/json application/xml image/svg+xml;
}
