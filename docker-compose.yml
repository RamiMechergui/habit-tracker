services:
  nginx:
    image: nginx:alpine
    hostname: nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - habit-network

  login:
    build: ./Backend/User/Identity/login
    hostname: login
    environment:
      - PORT=5101
      - MONGO_URI=mongodb://mongo:27017/identity_db
      - JWT_SECRET=${JWT_SECRET}
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4318
      - OTEL_SERVICE_NAME=login-service
    depends_on: [mongo, jaeger]
    networks: [habit-network]

  register:
    build: ./Backend/User/Identity/register
    hostname: register
    environment:
      - PORT=5102
      - MONGO_URI=mongodb://mongo:27017/identity_db
      - JWT_SECRET=${JWT_SECRET}
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4318
      - OTEL_SERVICE_NAME=register-service
    depends_on: [mongo, jaeger]
    networks: [habit-network]

  logout:
    build: ./Backend/User/Identity/logout
    hostname: logout
    environment:
      - PORT=5103
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4318
      - OTEL_SERVICE_NAME=logout-service
    depends_on: [jaeger]
    networks: [habit-network]

  verify:
    build: ./Backend/User/Identity/verify
    hostname: verify
    environment:
      - PORT=5104
      - JWT_SECRET=${JWT_SECRET}
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4318
      - OTEL_SERVICE_NAME=verify-service
    depends_on: [jaeger]
    networks: [habit-network]

  daily:
    build: ./Backend/User/Aggregator/daily
    hostname: daily
    environment:
      - PORT=5105
      - JWT_SECRET=${JWT_SECRET}
      - MORNING_SERVICE_URL=http://morning-habits:5118
      - BAD_SERVICE_URL=http://bad-habits:5119
      - NIGHT_SERVICE_URL=http://night-habits:5120
      - WEEKEND_SERVICE_URL=http://weekend-duties:5121
      - HUSTLE_SERVICE_URL=http://side-hustle:5122
      - VIDEO_SERVICE_URL=http://video-editing:5123
      - BOOK_LOG_SERVICE_URL=http://book-reading:5124
      - SYSTEM_SERVICE_URL=http://system-check:5125
      - EXPENSES_SERVICE_URL=http://expenses:5126
      - ANALYTICS_SERVICE_URL=http://analytics:5113
    depends_on: [mongo, morning-habits, bad-habits, night-habits, weekend-duties, side-hustle, video-editing, book-reading, system-check, expenses]
    networks: [habit-network]

  scoring:
    build: ./Backend/Admin/Analytics/scoring
    hostname: scoring
    environment:
      - PORT=5106
      - JWT_SECRET=${JWT_SECRET}
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4318
      - OTEL_SERVICE_NAME=scoring-service
    depends_on: [jaeger]
    networks: [habit-network]

  currentbook:
    build: ./Backend/Admin/Management/currentbook
    hostname: currentbook
    environment:
      - PORT=5107
      - MONGO_URI=mongodb://mongo:27017/currentbook_db
      - JWT_SECRET=${JWT_SECRET}
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4318
      - OTEL_SERVICE_NAME=currentbook-service
    depends_on: [mongo, jaeger]
    networks: [habit-network]

  archives:
    build: ./Backend/Admin/Management/archives
    hostname: archives
    environment:
      - PORT=5108
      - MONGO_URI=mongodb://mongo:27017/archives_db
      - JWT_SECRET=${JWT_SECRET}
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4318
      - OTEL_SERVICE_NAME=archives-service
    depends_on: [mongo, jaeger]
    networks: [habit-network]

  settings:
    build: ./Backend/User/Profile/settings
    hostname: settings
    environment:
      - PORT=5109
      - MONGO_URI=mongodb://mongo:27017/settings_db
      - JWT_SECRET=${JWT_SECRET}
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4318
      - OTEL_SERVICE_NAME=settings-service
    depends_on: [mongo, jaeger]
    networks: [habit-network]

  categories:
    build: ./Backend/Admin/Management/categories
    hostname: categories
    environment:
      - PORT=5110
      - MONGO_URI=mongodb://mongo:27017/categories_db
      - JWT_SECRET=${JWT_SECRET}
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4318
      - OTEL_SERVICE_NAME=categories-service
    depends_on: [mongo, jaeger]
    networks: [habit-network]

  avatar:
    build: ./Backend/User/Profile/avatar
    hostname: avatar
    environment:
      - PORT=5111
      - MONGO_URI=mongodb://mongo:27017/avatar_db
      - JWT_SECRET=${JWT_SECRET}
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4318
      - OTEL_SERVICE_NAME=avatar-service
    depends_on: [mongo, jaeger]
    networks: [habit-network]

  profile:
    build: ./Backend/User/Profile/profile
    hostname: profile
    environment:
      - PORT=5112
      - MONGO_URI=mongodb://mongo:27017/profile_db
      - JWT_SECRET=${JWT_SECRET}
      - AUTH_SERVICE_URL=http://verify:5104
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4318
      - OTEL_SERVICE_NAME=profile-service
    depends_on: [mongo, jaeger]
    networks: [habit-network]

  analytics:
    build: ./Backend/Admin/Analytics/analytics
    hostname: analytics
    environment:
      - PORT=5113
      - MONGO_URI=mongodb://mongo:27017/analytics_db
      - JWT_SECRET=${JWT_SECRET}
      - AUTH_SERVICE_URL=http://verify:5104
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4318
      - OTEL_SERVICE_NAME=analytics-service
    depends_on: [mongo, jaeger]
    networks: [habit-network]

  morning-habits:
    build: ./Backend/User/Habits/morning-habits
    hostname: morning-habits
    environment:
      - PORT=5118
      - MONGO_URI=mongodb://mongo:27017/morning_db
      - JWT_SECRET=${JWT_SECRET}
    depends_on: [mongo]
    networks: [habit-network]

  bad-habits:
    build: ./Backend/User/Habits/bad-habits
    hostname: bad-habits
    environment:
      - PORT=5119
      - MONGO_URI=mongodb://mongo:27017/bad_db
      - JWT_SECRET=${JWT_SECRET}
    depends_on: [mongo]
    networks: [habit-network]

  night-habits:
    build: ./Backend/User/Habits/night-habits
    hostname: night-habits
    environment:
      - PORT=5120
      - MONGO_URI=mongodb://mongo:27017/night_db
      - JWT_SECRET=${JWT_SECRET}
    depends_on: [mongo]
    networks: [habit-network]

  weekend-duties:
    build: ./Backend/User/Habits/weekend-duties
    hostname: weekend-duties
    environment:
      - PORT=5121
      - MONGO_URI=mongodb://mongo:27017/weekend_db
      - JWT_SECRET=${JWT_SECRET}
    depends_on: [mongo]
    networks: [habit-network]

  side-hustle:
    build: ./Backend/User/Habits/side-hustle
    hostname: side-hustle
    environment:
      - PORT=5122
      - MONGO_URI=mongodb://mongo:27017/hustle_db
      - JWT_SECRET=${JWT_SECRET}
    depends_on: [mongo]
    networks: [habit-network]

  video-editing:
    build: ./Backend/User/Habits/video-editing
    hostname: video-editing
    environment:
      - PORT=5123
      - MONGO_URI=mongodb://mongo:27017/video_db
      - JWT_SECRET=${JWT_SECRET}
    depends_on: [mongo]
    networks: [habit-network]

  book-reading:
    build: ./Backend/User/Habits/book-reading
    hostname: book-reading
    environment:
      - PORT=5124
      - MONGO_URI=mongodb://mongo:27017/book_reading_db
      - JWT_SECRET=${JWT_SECRET}
    depends_on: [mongo]
    networks: [habit-network]

  system-check:
    build: ./Backend/User/Habits/system-check
    hostname: system-check
    environment:
      - PORT=5125
      - MONGO_URI=mongodb://mongo:27017/system_db
      - JWT_SECRET=${JWT_SECRET}
    depends_on: [mongo]
    networks: [habit-network]

  expenses:
    build: ./Backend/User/Finances/expenses
    hostname: expenses
    environment:
      - PORT=5126
      - MONGO_URI=mongodb://mongo:27017/expenses_db
      - JWT_SECRET=${JWT_SECRET}
    depends_on: [mongo]
    networks: [habit-network]

  ideas:
    build: ./Backend/Admin/Planning/ideas
    hostname: ideas
    environment:
      - PORT=5128
      - MONGO_URI=mongodb://mongo:27017/ideas_db
      - JWT_SECRET=${JWT_SECRET}
    depends_on: [mongo]
    networks: [habit-network]

  frontend:
    build: ./frontend
    hostname: frontend
    networks: [habit-network]

  integration:
    build: ./Backend/Admin/Management/integration
    hostname: integration
    depends_on:
      - nginx
      - login
      - register
      - daily
      - scoring
      - currentbook
      - archives
      - settings
      - categories
      - avatar
      - profile
      - analytics
  mongo:
    image: mongo:6.0
    hostname: mongo
    volumes:
      - mongo_data:/data/db
    networks: [habit-network]

  jaeger:
    image: jaegertracing/all-in-one:latest
    hostname: jaeger
    environment:
      - QUERY_BASE_PATH=/admin/jaeger
    ports:
      - "16686:16686" # UI
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP
    networks:
      - habit-network

  prometheus:
    image: prom/prometheus:latest
    hostname: prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--web.external-url=/admin/prometheus/'
      - '--storage.tsdb.path=/prometheus'
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    networks:
      - habit-network

  grafana:
    image: grafana/grafana:latest
    hostname: grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_SERVER_ROOT_URL=%(protocol)s://%(domain)s:%(http_port)s/admin/grafana/
      - GF_SERVER_SERVE_FROM_SUB_PATH=true
      - GF_SECURITY_ALLOW_EMBEDDING=true
    networks:
      - habit-network

networks:
  habit-network:
    driver: bridge

volumes:
  mongo_data: