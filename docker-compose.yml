services:
  nginx:
    image: nginx:alpine
    hostname: nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - habit-network

  login:
    build: ./backend/User/Identity/login
    hostname: login
    environment:
      - PORT=5101
      - MONGO_URI=mongodb://mongo:27017/identity_db
      - JWT_SECRET=${JWT_SECRET}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
    depends_on: [mongo]
    networks: [habit-network]

  register:
    build: ./backend/User/Identity/register
    hostname: register
    environment:
      - PORT=5102
      - MONGO_URI=mongodb://mongo:27017/identity_db
      - JWT_SECRET=${JWT_SECRET}
    depends_on: [mongo]
    networks: [habit-network]

  logout:
    build: ./backend/User/Identity/logout
    hostname: logout
    environment:
      - PORT=5103
    networks: [habit-network]

  verify:
    build: ./backend/User/Identity/verify
    hostname: verify
    environment:
      - PORT=5104
      - JWT_SECRET=${JWT_SECRET}
      - MONGO_URI=mongodb://mongo:27017/identity_db
    networks: [habit-network]

  daily:
    build: ./backend/User/Aggregator/daily
    hostname: daily
    environment:
      - PORT=5105
      - JWT_SECRET=${JWT_SECRET}
      - MONGO_URI=mongodb://mongo:27017/daily_db
      - MORNING_SERVICE_URL=http://morning-habits:5118
      - BAD_SERVICE_URL=http://bad-habits:5119
      - NIGHT_SERVICE_URL=http://night-habits:5120
      - WEEKEND_SERVICE_URL=http://weekend-duties:5121
      - HUSTLE_SERVICE_URL=http://side-hustle:5122
      - VIDEO_SERVICE_URL=http://video-editing:5123
      - BOOK_LOG_SERVICE_URL=http://book-reading:5124
      - SYSTEM_SERVICE_URL=http://system-check:5125
      - EXPENSES_SERVICE_URL=http://expenses:5126
      - TASKS_SERVICE_URL=http://tasks-service:5131
      - ANALYTICS_SERVICE_URL=http://analytics:5113
    depends_on: [mongo, morning-habits, bad-habits, night-habits, weekend-duties, side-hustle, video-editing, book-reading, system-check, expenses, tasks-service]
    networks: [habit-network]

  scoring:
    build: ./backend/Admin/Analytics/scoring
    hostname: scoring
    environment:
      - PORT=5106
      - JWT_SECRET=${JWT_SECRET}
    networks: [habit-network]

  currentbook:
    build: ./backend/Admin/Management/currentbook
    hostname: currentbook
    environment:
      - PORT=5107
      - MONGO_URI=mongodb://mongo:27017/currentbook_db
      - JWT_SECRET=${JWT_SECRET}
    depends_on: [mongo]
    networks: [habit-network]

  archives:
    build: ./backend/Admin/Management/archives
    hostname: archives
    environment:
      - PORT=5108
      - MONGO_URI=mongodb://mongo:27017/archives_db
      - JWT_SECRET=${JWT_SECRET}
    depends_on: [mongo]
    networks: [habit-network]

  settings:
    build: ./backend/User/Profile/settings
    hostname: settings
    environment:
      - PORT=5109
      - MONGO_URI=mongodb://mongo:27017/settings_db
      - JWT_SECRET=${JWT_SECRET}
    depends_on: [mongo]
    networks: [habit-network]

  categories:
    build: ./backend/Admin/Management/categories
    hostname: categories
    environment:
      - PORT=5110
      - MONGO_URI=mongodb://mongo:27017/categories_db
      - JWT_SECRET=${JWT_SECRET}
    depends_on: [mongo]
    networks: [habit-network]

  avatar:
    build: ./backend/User/Profile/avatar
    hostname: avatar
    environment:
      - PORT=5111
      - MONGO_URI=mongodb://mongo:27017/avatar_db
      - JWT_SECRET=${JWT_SECRET}
    depends_on: [mongo]
    networks: [habit-network]

  profile:
    build: ./backend/User/Profile/profile
    hostname: profile
    environment:
      - PORT=5112
      - MONGO_URI=mongodb://mongo:27017/profile_db
      - JWT_SECRET=${JWT_SECRET}
      - AUTH_SERVICE_URL=http://verify:5104
    depends_on: [mongo]
    networks: [habit-network]

  analytics:
    build: ./backend/Admin/Analytics/analytics
    hostname: analytics
    environment:
      - PORT=5113
      - MONGO_URI=mongodb://mongo:27017/analytics_db
      - JWT_SECRET=${JWT_SECRET}
      - AUTH_SERVICE_URL=http://verify:5104
    depends_on: [mongo]
    networks: [habit-network]

  morning-habits:
    build: ./backend/User/Habits/morning-habits
    hostname: morning-habits
    environment:
      - PORT=5118
      - MONGO_URI=mongodb://mongo:27017/morning_db
      - JWT_SECRET=${JWT_SECRET}
    depends_on: [mongo]
    networks: [habit-network]

  bad-habits:
    build: ./backend/User/Habits/bad-habits
    hostname: bad-habits
    environment:
      - PORT=5119
      - MONGO_URI=mongodb://mongo:27017/bad_db
      - JWT_SECRET=${JWT_SECRET}
    depends_on: [mongo]
    networks: [habit-network]

  night-habits:
    build: ./backend/User/Habits/night-habits
    hostname: night-habits
    environment:
      - PORT=5120
      - MONGO_URI=mongodb://mongo:27017/night_db
      - JWT_SECRET=${JWT_SECRET}
    depends_on: [mongo]
    networks: [habit-network]

  weekend-duties:
    build: ./backend/User/Habits/weekend-duties
    hostname: weekend-duties
    environment:
      - PORT=5121
      - MONGO_URI=mongodb://mongo:27017/weekend_db
      - JWT_SECRET=${JWT_SECRET}
    depends_on: [mongo]
    networks: [habit-network]

  side-hustle:
    build: ./backend/User/Habits/side-hustle
    hostname: side-hustle
    environment:
      - PORT=5122
      - MONGO_URI=mongodb://mongo:27017/hustle_db
      - JWT_SECRET=${JWT_SECRET}
    depends_on: [mongo]
    networks: [habit-network]

  video-editing:
    build: ./backend/User/Habits/video-editing
    hostname: video-editing
    environment:
      - PORT=5123
      - MONGO_URI=mongodb://mongo:27017/video_db
      - JWT_SECRET=${JWT_SECRET}
    depends_on: [mongo]
    networks: [habit-network]

  book-reading:
    build: ./backend/User/Habits/book-reading
    hostname: book-reading
    environment:
      - PORT=5124
      - MONGO_URI=mongodb://mongo:27017/book_reading_db
      - JWT_SECRET=${JWT_SECRET}
    depends_on: [mongo]
    networks: [habit-network]

  system-check:
    build: ./backend/User/Habits/system-check
    hostname: system-check
    environment:
      - PORT=5125
      - MONGO_URI=mongodb://mongo:27017/system_db
      - JWT_SECRET=${JWT_SECRET}
    depends_on: [mongo]
    networks: [habit-network]

  expenses:
    build: ./backend/User/Finances/expenses
    hostname: expenses
    environment:
      - PORT=5126
      - MONGO_URI=mongodb://mongo:27017/expenses_db
      - JWT_SECRET=${JWT_SECRET}
    depends_on: [mongo]
    networks: [habit-network]

  tasks-service:
    build: ./backend/User/Habits/tasks-service
    hostname: tasks-service
    environment:
      - PORT=5131
      - MONGO_URI=mongodb://mongo:27017/tasks_db
      - JWT_SECRET=${JWT_SECRET}
      - KAFKA_BROKER=kafka:9092
    depends_on: [mongo, kafka]
    networks: [habit-network]

  notes-service:
    build: ./backend/User/Habits/notes-service
    hostname: notes-service
    environment:
      - PORT=5132
      - MONGO_URI=mongodb://mongo:27017/notes_db
      - JWT_SECRET=${JWT_SECRET}
    depends_on: [mongo]
    networks: [habit-network]

  mongo:
    image: mongo:6.0
    hostname: mongo
    volumes:
      - mongo_data:/data/db
    networks: [habit-network]

  # ── Kafka Infrastructure ─────────────────────────────────────
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    hostname: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    volumes:
      - zookeeper_data:/var/lib/zookeeper/data
    networks: [habit-network]

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    hostname: kafka
    depends_on: [zookeeper]
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_NUM_PARTITIONS: 10
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      # Pre-create topics with 10 partitions each
      KAFKA_CREATE_TOPICS: "item-status-changed:10:1,notifications-created:10:1,notifications-created-dlq:1:1,task-notifications:10:1"
    volumes:
      - kafka_data:/var/lib/kafka/data
    networks: [habit-network]
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "kafka:9092"]
      interval: 10s
      timeout: 10s
      retries: 10

  # ── Essentials Microservices ─────────────────────────────────
  essentials:
    build: ./backend/User/Essentials/item-service
    hostname: essentials
    environment:
      - PORT=5127
      - MONGO_URI=mongodb://mongo:27017/essentials_db
      - JWT_SECRET=${JWT_SECRET}
      - KAFKA_BROKER=kafka:9092
    depends_on: [mongo, kafka]
    networks: [habit-network]

  notifications:
    build: ./backend/User/Essentials/notification-service
    hostname: notifications
    environment:
      - PORT=5128
      - MONGO_URI=mongodb://mongo:27017/notifications_db
      - JWT_SECRET=${JWT_SECRET}
      - KAFKA_BROKER=kafka:9092
      - TASKS_SERVICE_URL=http://tasks-service:5131
    depends_on: [mongo, kafka]
    networks: [habit-network]


  user-prefs:
    build: ./backend/User/Essentials/user-prefs-service
    hostname: user-prefs
    environment:
      - PORT=5130
      - MONGO_URI=mongodb://mongo:27017/user_prefs_db
      - JWT_SECRET=${JWT_SECRET}
    depends_on: [mongo]
    networks: [habit-network]

  credentials:
    build: ./backend/User/Profile/credentials
    hostname: credentials
    environment:
      - PORT=5133
      - MONGO_URI=mongodb://mongo:27017/credentials_db
      - JWT_SECRET=${JWT_SECRET}
    depends_on: [mongo]
    networks: [habit-network]

networks:
  habit-network:
    driver: bridge

volumes:
  mongo_data:
  zookeeper_data:
  kafka_data:
