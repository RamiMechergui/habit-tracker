services:
  # ── Frontend (Vite Dev Server) ───────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    hostname: frontend
    ports:
      - "80:80"
    environment:
      - VITE_API_URL_NATIVE=http://backend:5000
      - VITE_API_TARGET=http://backend:5000
      - NODE_OPTIONS=--max-old-space-size=2048
    networks:
      - habit-network
    depends_on:
      - backend
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 1G

  # ── Monolithic Backend API ────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    hostname: backend
    ports:
      - "5001:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      # ── DynamoDB (Local or AWS) ────────────────────────────────
      # Set DYNAMODB_ENDPOINT to use DynamoDB Local; remove it for real AWS
      - DYNAMODB_ENDPOINT=http://dynamodb-local:8000
      - AWS_REGION=${AWS_REGION:-us-east-1}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-local}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-local}
      # ── App secrets ────────────────────────────────────────────
      - JWT_SECRET=${JWT_SECRET:-your_super_secure_jwt_secret_key_change_in_production_12345}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-change_this_admin_dashboard_password}
      - CLIENT_URL=http://localhost
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:-}
    networks:
      - habit-network
    depends_on:
      dynamodb-local:
        condition: service_healthy

  # ── DynamoDB Local ────────────────────────────────────────────────
  dynamodb-local:
    image: amazon/dynamodb-local:latest
    hostname: dynamodb-local
    ports:
      - "8000:8000"
    command: ["-jar", "DynamoDBLocal.jar", "-sharedDb", "-inMemory"]
    networks:
      - habit-network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/shell || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # ── DynamoDB Admin UI ─────────────────────────────────────────────
  dynamodb-admin:
    image: aaronshaf/dynamodb-admin:latest
    hostname: dynamodb-admin
    ports:
      - "8001:8001"
    environment:
      - DYNAMO_ENDPOINT=http://dynamodb-local:8000
      - AWS_REGION=${AWS_REGION:-us-east-1}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-local}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-local}
    networks:
      - habit-network
    depends_on:
      dynamodb-local:
        condition: service_healthy

networks:
  habit-network:
    driver: bridge