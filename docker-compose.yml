services:
  # ── Frontend (Vite Dev Server) ───────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    hostname: frontend
    ports:
      - "80:80"
    environment:
      - VITE_API_URL_NATIVE=http://backend:5000
      - VITE_API_TARGET=http://backend:5000
      - NODE_OPTIONS=--max-old-space-size=2048
    networks:
      - habit-network
    depends_on:
      - backend
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 1G

  # ── Monolithic Backend API ────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    hostname: backend
    ports:
      - "5001:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - JWT_SECRET=${JWT_SECRET:-your_super_secure_jwt_secret_key_change_in_production_12345}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-change_this_admin_dashboard_password}
      - CLIENT_URL=http://localhost
    volumes:
      - ./backend:/app
      - /app/node_modules
    networks:
      - habit-network
    depends_on:
      - mongo

  # ── MongoDB Database ──────────────────────────────────────────────
  mongo:
    image: mongo:6.0
    hostname: mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - habit-network

  # ── Mongo Express (Admin UI) ──────────────────────────────────────
  mongo-express:
    image: mongo-express:1.0
    hostname: mongo-express
    ports:
      - "8081:8081"
    environment:
      ME_CONFIG_MONGODB_SERVER: mongo
      ME_CONFIG_MONGODB_PORT: 27017
      ME_CONFIG_BASICAUTH_USERNAME: admin
      ME_CONFIG_BASICAUTH_PASSWORD: ${ME_PASSWORD:-changeme_in_production}
    networks:
      - habit-network
    depends_on:
      - mongo

networks:
  habit-network:
    driver: bridge

volumes:
  mongo_data: