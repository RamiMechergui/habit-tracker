services:
  # ── Frontend (Vite Dev Server) ───────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    hostname: frontend
    ports:
      - "5173:80"
    environment:
      - VITE_API_URL_NATIVE=http://backend:5000
      - VITE_API_TARGET=http://backend:5000
      - NODE_OPTIONS=--max-old-space-size=2048
    networks:
      - habit-network
    depends_on:
      - backend
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 1G

  # ── Monolithic Backend API ────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    hostname: backend
    ports:
      - "5001:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      # ── DynamoDB (Local or AWS) ────────────────────────────────
      # Set DYNAMODB_ENDPOINT to use DynamoDB Local; remove it for real AWS
      - DYNAMODB_ENDPOINT=http://dynamodb-local:8000
      - AWS_REGION=${AWS_REGION:-us-east-1}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-local}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-local}
      # ── App secrets ────────────────────────────────────────────
      - JWT_SECRET=${JWT_SECRET:-your_super_secure_jwt_secret_key_change_in_production_12345}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-change_this_admin_dashboard_password}
      - CLIENT_URL=http://localhost
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:-}
      # ── MinIO / S3-compatible storage ────────────────────────────
      - STORAGE_ENDPOINT=http://minio:9000
      - STORAGE_ACCESS_KEY=admin
      - STORAGE_SECRET_KEY=password123
      - STORAGE_BUCKET=learning-german-images
      - STORAGE_REGION=us-east-1
      - USE_PATH_STYLE=true
    networks:
      - habit-network
    volumes:
      - uploads-data:/app/uploads
    depends_on:
      dynamodb-local:
        condition: service_healthy
      minio:
        condition: service_healthy

  # ── DynamoDB Local ────────────────────────────────────────────────
  dynamodb-local:
    image: amazon/dynamodb-local:latest
    hostname: dynamodb-local
    ports:
      - "8000:8000"
    user: "root:root"
    command: ["-jar", "DynamoDBLocal.jar", "-sharedDb", "-dbPath", "/data"]
    volumes:
      - dynamodb-data:/data
    networks:
      - habit-network
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:8000/ >/dev/null || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # ── MinIO Object Storage (S3-compatible) ────────────────────────────
  # Stores all Learning German images. S3-compatible API — switch to
  # AWS S3 in production by changing STORAGE_* environment variables.
  minio:
    image: minio/minio:latest
    hostname: minio
    container_name: minio
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # MinIO Console (web UI)
    environment:
      - MINIO_ROOT_USER=admin
      - MINIO_ROOT_PASSWORD=password123
    volumes:
      - minio-data:/data
    networks:
      - habit-network
    command: server /data --console-address ":9001"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9000/minio/health/live >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # ── DynamoDB Admin UI ─────────────────────────────────────────────
  dynamodb-admin:
    image: aaronshaf/dynamodb-admin:latest
    hostname: dynamodb-admin
    ports:
      - "8001:8001"
    environment:
      - DYNAMO_ENDPOINT=http://dynamodb-local:8000
      - AWS_REGION=${AWS_REGION:-us-east-1}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-local}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-local}
    networks:
      - habit-network
    depends_on:
      dynamodb-local:
        condition: service_healthy

volumes:
  dynamodb-data:
  minio-data:
  uploads-data:

networks:
  habit-network:
    driver: bridge